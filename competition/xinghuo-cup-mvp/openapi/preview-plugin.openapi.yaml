openapi: 3.0.3
info:
  title: Xinghuo Portfolio Preview
  version: 0.1.0
  description: Validates and hosts HTML generated by the Astron Agent workflow.
servers:
  - url: https://replace-with-worker-domain.example
paths:
  /api/v1/competition/previews:
    post:
      operationId: createPortfolioPreview
      summary: Validate and publish one immutable portfolio preview
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
      responses:
        '201':
          description: Immutable preview created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewCreated'
        '400':
          description: Malformed JSON
        '401':
          description: Missing or invalid Bearer token
        '413':
          description: Request exceeds 512000 bytes
        '422':
          description: validation_failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'
        '503':
          description: Preview storage is unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ApprovedCopyBlock:
      type: object
      required: [text, approval_status, fact_ids]
      properties:
        text:
          type: string
        approval_status:
          type: string
          enum: [user_approved]
        fact_ids:
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^FACT-[0-9]{3,}$'
    PreviewRequest:
      type: object
      additionalProperties: false
      required: [approved_copy, content_map, creative_direction, generated_html]
      properties:
        approved_copy:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ApprovedCopyBlock'
        content_map:
          type: object
          additionalProperties: true
        creative_direction:
          type: object
          required: [visual_protagonist, composition_commitment]
          additionalProperties: true
          properties:
            visual_protagonist:
              type: string
            composition_commitment:
              type: string
        generated_html:
          type: string
          maxLength: 512000
    PreviewChecks:
      type: object
      required: [security, content_fidelity, responsive, template_independence]
      properties:
        security:
          type: string
          enum: [passed]
        content_fidelity:
          type: string
          enum: [passed]
        responsive:
          type: string
          enum: [passed]
        template_independence:
          type: string
          enum: [passed]
    PreviewCreated:
      type: object
      required: [preview_id, preview_url, status, checks]
      properties:
        preview_id:
          type: string
        preview_url:
          type: string
          format: uri
        status:
          type: string
          enum: [ready]
        checks:
          $ref: '#/components/schemas/PreviewChecks'
    ValidationFailure:
      type: object
      required: [error, details]
      properties:
        error:
          type: string
          enum: [validation_failed]
        details:
          type: array
          items:
            type: string
